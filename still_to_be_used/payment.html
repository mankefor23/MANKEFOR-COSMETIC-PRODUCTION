<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Place Order - MANKEFOR COSMETIC PRODUCTION</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link rel="stylesheet" href="styles.css" />
        <style>
            .order-container {
                max-width: 800px;
                margin: 8rem auto 2rem;
                padding: 2rem;
            }
            .order-summary {
                background: white;
                padding: 2rem;
                border-radius: var(--border-radius);
                box-shadow: 0 0.25rem 0.625rem rgba(0, 0, 0, 0.1);
                margin-bottom: 2rem;
            }
            .order-item {
                display: flex;
                justify-content: space-between;
                padding: 1rem;
                border-bottom: 1px solid #eee;
            }
            .order-total {
                display: flex;
                justify-content: space-between;
                padding: 1rem;
                font-size: 1.2rem;
                font-weight: bold;
                background: var(--bg-light);
                margin-top: 1rem;
            }
            .form-section {
                background: white;
                padding: 2rem;
                border-radius: var(--border-radius);
                box-shadow: 0 0.25rem 0.625rem rgba(0, 0, 0, 0.1);
                margin-bottom: 2rem;
            }
        </style>
    </head>
    <body>
        <!-- Navigation -->
        <nav class="navbar" id="navbar">
            <div class="navbar-brand">
                <div class="logo">
                    <img src="/images/prelogo.png" alt="Mankefor Logo" />
                </div>
                <div class="brand-text">
                    <p class="brand-name">MANKEFOR</p>
                    <p class="brand-subtitle">COSMETIC</p>
                </div>
            </div>
            <button
                class="menu-toggle"
                id="mobile-menu"
                aria-label="Toggle mobile menu"
            >
                <span></span><span></span><span></span>
            </button>
            <div class="navbar-nav" id="nav-menu">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="customer-dashboard.html">DASHBOARD</a></li>
                </ul>
            </div>
        </nav>

        <!-- Order Form -->
        <main class="order-container">
            <h1>Place Your Order</h1>

            <!-- Order Summary -->
            <div class="order-summary" id="orderSummary">
                <h2>Order Summary</h2>
                <div id="orderItems">
                    <p class="text-center">Loading order items...</p>
                </div>
                <div class="order-total" id="orderTotal">
                    <span>Total: XAF 0</span>
                </div>
            </div>

            <!-- Customer Information -->
            <form id="orderForm" class="form-section">
                <h2>Delivery Information</h2>
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input
                        type="text"
                        class="form-input"
                        id="fullName"
                        name="fullName"
                        required
                    />
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input
                        type="tel"
                        class="form-input"
                        id="phone"
                        name="phone"
                        required
                    />
                </div>
                <div class="form-group">
                    <label class="form-label" for="address"
                        >Delivery Address</label
                    >
                    <input
                        type="text"
                        class="form-input"
                        id="address"
                        name="address"
                        required
                    />
                </div>
                <div class="form-group">
                    <label class="form-label" for="city">City</label>
                    <input
                        type="text"
                        class="form-input"
                        id="city"
                        name="city"
                        required
                    />
                </div>
                <button
                    type="submit"
                    class="btn"
                    style="width: 100%; margin-top: 1rem"
                >
                    Confirm Order
                </button>
            </form>
        </main>
        
        <!-- Note: Payment page requires JavaScript for functionality -->
        <!-- This is a static placeholder until backend is implemented -->
    </body>
</html>
