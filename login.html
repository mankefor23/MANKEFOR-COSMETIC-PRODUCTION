<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Signup - MANKEFOR COSMETIC PRODUCTION</title>
    <link rel="icon" type="image/png" href="/images/logo-mankefor.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #b7ddec, #613d2069, #b7ddec);
        min-height: 100vh;
      }

      .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 7.5rem);
        margin-top: 7.5rem;
        padding: 2rem 1rem;
      }

      .container {
        width: 350px;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .form {
        display: none;
      }

      .form.active {
        display: block;
      }

      .form input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .form button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: #ff7200;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
      }

      .form button:hover {
        background: #45a049;
      }

      .toggle-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }

      .toggle-link a {
        color: #4caf50;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
      }

      .toggle-link a:hover {
        text-decoration: underline;
      }

      .message {
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        text-align: center;
        display: none;
      }

      .message.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
        display: block;
      }

      .message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        display: block;
      }

      .loading {
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="navbar-brand">
            <div class="logo">
                <img src="/images/logo-mankefor.png" alt="Mankefor Logo" />
            </div>
            <div class="brand-text">
                <p class="brand-name">MANKEFOR</p>
                <p class="brand-subtitle">COSMETIC</p>
            </div>
        </div>

        <button class="menu-toggle" id="mobile-menu" aria-label="Toggle mobile menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="navbar-nav" id="nav-menu">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="product.html">PRODUCT</a></li>
                <li><a href="contact.html">CONTACT</a></li>
                <li class="search-container">
                    <a href="search.html">
                        <button class="search-btn">Search</button>
                    </a>
                </li>
                <li class="cart-icon-container">
                    <a href="cart.html" class="cart-link">
                        <i class="fa fa-shopping-cart"></i>
                        <span class="cart-badge">0</span>
                    </a>
                </li>
                <li class="user-icon-container">
                    <a href="login.html" class="user-link">
                        <div class="user-icon-outline">
                            <i class="fa fa-user"></i>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="login-wrapper">
    <div class="container">
      <!-- Message Display -->
      <div class="message" id="message"></div>

      <!-- Signup Form -->
      <form class="form" id="signupForm">
        <h2>Signup</h2>
        <input type="text" name="firstName" placeholder="First Name" required />
        <input type="text" name="lastName" placeholder="Last Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="tel" name="phone" placeholder="Phone Number" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Signup</button>
        <div class="toggle-link">
          Already have an account?
          <a onclick="toggleForm('loginForm')">Login here</a>
        </div>
      </form>

      <!-- Login Form -->
      <form class="form active" id="loginForm">
        <h2>Login</h2>
        <label for="email"> Email</label><br>
        <input type="email" name="email" id="loginEmail" placeholder="Email" required />
        <label for="password">Password</label><br>
        <input type="password" name="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
        <div class="toggle-link">
        Don't have account?
          <a onclick="toggleForm('signupForm')">Signup here</a>
        </div>
      </form>

      
      </div>
    </div>
    </div>

    <!-- API Script -->
    <script src="api.js"></script>
    <script src="navbar-auth.js"></script>
    
    <script>
      // Mobile menu toggle
      document.getElementById('mobile-menu').addEventListener('click', function() {
        document.getElementById('nav-menu').classList.toggle('active');
        this.classList.toggle('active');
      });

      // Toggle between login and signup forms
      function toggleForm(formId) {
        document.querySelectorAll(".form").forEach((form) => {
          form.classList.remove("active");
        });
        document.getElementById(formId).classList.add("active");
        // Clear messages when switching forms
        hideMessage();
      }

      // Message functions
      function showMessage(message, type = 'error') {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = message;
        messageDiv.className = 'message ' + type;
      }

      function hideMessage() {
        const messageDiv = document.getElementById('message');
        messageDiv.className = 'message';
        messageDiv.textContent = '';
      }

      // Handle Signup Form
      document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        hideMessage();

        // Get form data
        const formData = new FormData(this);
        const firstName = formData.get('firstName').trim();
        const lastName = formData.get('lastName').trim();
        const email = formData.get('email').trim();
        const phone = formData.get('phone').trim();
        const password = formData.get('password');
        
        // Basic validation
        if (!firstName || !lastName || !email || !phone || !password) {
          showMessage('Please fill in all fields', 'error');
          return;
        }

        if (password.length < 6) {
          showMessage('Password must be at least 6 characters', 'error');
          return;
        }

        // Show loading state
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Creating account...';
        submitBtn.disabled = true;
        this.classList.add('loading');

        try {
          // Call API
          const response = await API.register({
            firstName: firstName,
            lastName: lastName,
            email: email,
            phone: phone,
            password: password
          });

          // Show success message
          showMessage('Account created successfully! Redirecting...', 'success');
          
          // Update navbar
          updateNavbarUser();

          // Redirect to home page after 1.5 seconds
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);

        } catch (error) {
          // Show error message
          const errorMessage = error.message || 'Registration failed. Please try again.';
          showMessage(errorMessage, 'error');
        } finally {
          // Reset button
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
          this.classList.remove('loading');
        }
      });

      // Handle Login Form
      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        hideMessage();

        // Get form data
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        // Basic validation
        if (!email || !password) {
          showMessage('Please enter email and password', 'error');
          return;
        }

        // Show loading state
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Logging in...';
        submitBtn.disabled = true;
        this.classList.add('loading');

        try {
          // Call API
          const response = await API.login({
            email: email,
            password: password
          });

          // Show success message
          showMessage('Login successful! Redirecting...', 'success');
          
          // Update navbar
          updateNavbarUser();

          // Redirect based on user role
          setTimeout(() => {
            if (API.isAdmin()) {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 1500);

        } catch (error) {
          // Show error message
          const errorMessage = error.message || 'Login failed. Please check your credentials.';
          showMessage(errorMessage, 'error');
        } finally {
          // Reset button
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
          this.classList.remove('loading');
        }
      });

      // Check if already logged in
      if (API.isAuthenticated()) {
        // User is already logged in, redirect to home
        window.location.href = 'index.html';
      }
    </script>
  </body>
</html>
